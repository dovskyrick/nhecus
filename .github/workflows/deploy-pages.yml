# website/ → GitHub Pages (https://dovskyrick.github.io/nhecus/)
# One-time: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main, claude/gallant-mccarthy-ckexb4]
    paths: ['website/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Pages serves this repo at https://<user>.github.io/<repo>/ — use "/" once nhecus.com points here.
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          # Optional fallbacks only — email + Instagram are normally set in the back-office (About & contact).
          VITE_INSTAGRAM_HANDLE: ${{ vars.VITE_INSTAGRAM_HANDLE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
